<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080f1f"><title>ИГПЗС Flashcards v4</title><style>:root{--a:#7dd3fc;--b:#a78bfa;--c:#34d399;--bg:#07111f;--ink:#08111f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% -10%,#7dd3fc55,transparent 22rem),radial-gradient(circle at 100% 10%,#a78bfa44,transparent 20rem),radial-gradient(circle at 40% 105%,#34d3993d,transparent 22rem),linear-gradient(145deg,#020617,#0f172a 48%,#111827);overscroll-behavior-y:none}button,input{font:inherit}button{border:0;cursor:pointer}.app{min-height:100dvh;max-width:920px;margin:0 auto;padding:max(13px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto 1fr auto;gap:11px}.panel{background:linear-gradient(145deg,#ffffff24,#ffffff10);border:1px solid #ffffff29;border-radius:30px;box-shadow:0 20px 60px #02061755;backdrop-filter:blur(22px)}.top{padding:15px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}h1{margin:0;font-size:clamp(27px,8vw,46px);letter-spacing:-.055em;line-height:.95}.sub{margin:8px 0 0;color:#cbd5e1;font-size:13px;line-height:1.35}.badge{white-space:nowrap;background:#ecfeff;color:#155e75;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:950;box-shadow:inset 0 0 0 1px #cffafe}.stats{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;color:#dbeafe;font-size:13px}.barbox{grid-column:1/-1;height:12px;border-radius:999px;background:#ffffff24;overflow:hidden}.bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b),var(--c));transition:.28s}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.tab{min-height:48px;border-radius:22px;background:#ffffff14;color:#e2e8f0;font-weight:950;border:1px solid #ffffff24}.tab.on{background:linear-gradient(135deg,#7dd3fc,#a78bfa 55%,#34d399);color:#03131d;border:0}.tools{padding:12px;display:grid;gap:10px}.search{display:flex;align-items:center;gap:8px;background:#fffffff7;color:#0f172a;border-radius:22px;padding:12px 14px;box-shadow:0 10px 24px #0206172e}.search input{width:100%;border:0;outline:0;background:transparent}.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 0 4px}.chips::-webkit-scrollbar{display:none}.chip,.mini{flex:0 0 auto;border-radius:999px;padding:9px 13px;background:#ffffff14;color:#e2e8f0;border:1px solid #ffffff24;font-size:13px;font-weight:850}.chip.on{background:linear-gradient(135deg,#7dd3fc,#a78bfa);color:#07111f;border:0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{border-radius:18px;padding:9px 5px}.zone{display:flex;align-items:center;justify-content:center;min-height:0}.stage{width:100%;perspective:1500px;transform:translateZ(0)}.stage.leave-left{animation:leaveLeft .17s ease-in forwards}.stage.leave-right{animation:leaveRight .17s ease-in forwards}.stage.enter-left{animation:enterLeft .23s cubic-bezier(.2,.8,.2,1) forwards}.stage.enter-right{animation:enterRight .23s cubic-bezier(.2,.8,.2,1) forwards}@keyframes leaveLeft{to{opacity:0;transform:translateX(-46px) rotateZ(-1deg) scale(.985)}}@keyframes leaveRight{to{opacity:0;transform:translateX(46px) rotateZ(1deg) scale(.985)}}@keyframes enterLeft{from{opacity:0;transform:translateX(-54px) rotateZ(-1.5deg) scale(.985)}to{opacity:1;transform:translateX(0) rotateZ(0) scale(1)}}@keyframes enterRight{from{opacity:0;transform:translateX(54px) rotateZ(1.5deg) scale(.985)}to{opacity:1;transform:translateX(0) rotateZ(0) scale(1)}}.cardShell{position:relative;border-radius:36px;padding:2px;background:linear-gradient(135deg,#7dd3fc,#a78bfa 47%,#34d399);box-shadow:0 28px 85px #02061782}.cardShell:before{content:"";position:absolute;inset:-2px;border-radius:38px;background:linear-gradient(135deg,#7dd3fc66,#a78bfa66,#34d39966);filter:blur(18px);z-index:-1}.card{height:min(55dvh,560px);min-height:405px;position:relative;transform-style:preserve-3d;transition:transform .36s cubic-bezier(.2,.75,.2,1);touch-action:pan-y}.card.flipped{transform:rotateY(180deg)}.side{position:absolute;inset:0;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;background:linear-gradient(160deg,#ffffff,#eef6ff 60%,#f7f0ff);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden}.side:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 10%,#7dd3fc20,transparent 17rem),radial-gradient(circle at 90% 20%,#a78bfa24,transparent 15rem);pointer-events:none}.back{transform:rotateY(180deg)}.meta{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px 16px 0;color:#64748b;font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.12em}.pill{max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0;border-radius:999px;background:#0f172a;color:white;padding:7px 10px;font-size:11px}.content{position:relative;z-index:1;flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;align-items:center;justify-content:center;padding:16px 19px 25px}.front{text-align:center;font-size:clamp(31px,10.5vw,68px);line-height:1.06;letter-spacing:-.015em;font-weight:1000;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}.front.long{font-size:clamp(25px,7.6vw,48px)}.front.xlong{font-size:clamp(21px,6.35vw,39px);letter-spacing:0}.def{width:100%;max-width:760px;font-size:clamp(18px,4.75vw,26px);line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;color:#111827}.gridWrap{width:100%;align-self:stretch;overflow:auto;padding:2px 0 8px}.gridInfo{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 10px;color:#dbeafe;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.smallCard{position:relative;min-height:96px;border-radius:24px;padding:13px 12px;text-align:left;background:linear-gradient(160deg,#ffffff,#eef6ff 70%,#f7f0ff);color:#0f172a;box-shadow:0 12px 34px #02061740;border:1px solid #ffffff99;overflow:hidden}.smallCard:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top left,#7dd3fc38,transparent 7rem),radial-gradient(circle at bottom right,#a78bfa2c,transparent 7rem);pointer-events:none}.smallCard b{position:relative;display:block;font-size:16px;line-height:1.12;letter-spacing:-.02em;overflow-wrap:normal;word-break:normal}.smallCard span{position:relative;display:inline-block;margin-top:9px;border-radius:999px;background:#0f172a;color:white;padding:5px 7px;font-size:10px;font-weight:850;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.smallCard.done{opacity:.58}.smallCard.done:after{content:"✓";position:absolute;right:10px;top:8px;width:24px;height:24px;border-radius:999px;background:#34d399;color:#052e16;display:grid;place-items:center;font-weight:950}.hint{margin:7px 0 0;text-align:center;color:#cbd5e1;font-size:13px}.bottom{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;z-index:10}.btn{min-height:52px;border-radius:20px;background:#fffffff2;color:#0f172a;font-weight:950;box-shadow:0 14px 32px #0206174a}.btn.primary{background:linear-gradient(135deg,#7dd3fc,#a78bfa 55%,#34d399);color:#03131d}.btn.ghost{background:#ffffff22;color:#f8fafc;border:1px solid #ffffff2e}.btn.learned{background:#34d399;color:#052e16}.modal{position:fixed;inset:0;display:none;z-index:40;padding:14px;background:#020617b8;backdrop-filter:blur(10px);align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;max-height:88dvh;margin:0 auto;background:linear-gradient(160deg,#fff,#eef6ff 70%,#f7f0ff);color:#0f172a;border-radius:32px 32px 24px 24px;box-shadow:0 30px 100px #0009;overflow:hidden;animation:sheet .18s ease-out}@keyframes sheet{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}.sheetHead{padding:16px 16px 10px;border-bottom:1px solid #0f172a12}.sheetHeadTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sheet h2{margin:8px 0 0;font-size:clamp(26px,8vw,44px);line-height:1.05;letter-spacing:-.04em}.close{width:42px;height:42px;border-radius:50%;background:#0f172a;color:white;font-size:24px;font-weight:800;flex:0 0 auto}.sheetBody{padding:16px;max-height:55dvh;overflow:auto;font-size:19px;line-height:1.48}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 16px}.empty{width:100%;padding:32px 20px;background:white;color:#0f172a;border-radius:32px;text-align:center;box-shadow:0 28px 80px #02061780}.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;background:#020617f2;border:1px solid #ffffff29;color:white;padding:10px 15px;border-radius:999px;font-weight:900;transition:.2s;z-index:50;white-space:nowrap}@media(max-width:430px){.app{gap:8px;padding-left:10px;padding-right:10px}.top,.tools{padding:12px}.sub{font-size:12.3px}.badge{font-size:11px;padding:7px 8px}.actions{grid-template-columns:repeat(2,1fr)}.card{min-height:390px;height:min(53dvh,500px)}.bottom{grid-template-columns:1fr 1fr}.bottom #learn{grid-column:1/-1;order:-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.smallCard{min-height:88px;padding:12px 11px;border-radius:22px}.smallCard b{font-size:15px}.sheetBody{font-size:18px}}@media(min-width:760px){.app{padding-top:26px;padding-bottom:26px;gap:14px}.top,.tools{padding:18px}.content{padding:22px 40px 36px}.bottom,.actions{max-width:620px;width:100%;justify-self:center}.bottom{position:static}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.modal{align-items:center}.sheet{border-radius:34px}.sheetBody{max-height:60dvh}}</style></head><body><main class="app"><section class="top panel"><div class="head"><div><h1>ИГПЗС Flashcards</h1><p class="sub">v4: режим учёбы + вкладка со всеми маленькими карточками.</p></div><div class="badge" id="badge">Загрузка…</div></div><div class="stats"><small id="prog">Выучено 0</small><small id="pct">0%</small><div class="barbox"><div class="bar" id="bar"></div></div></div></section><section class="tabs panel"><button class="tab on" id="tabStudy">Учить</button><button class="tab" id="tabAll">Все карточки</button></section><section class="tools panel"><label class="search"><span>🔎</span><input id="q" type="search" autocomplete="off" placeholder="Поиск по термину или определению"></label><div class="chips" id="chips"></div><div class="actions" id="actions"><button class="mini" id="rnd">🎲 Рандом</button><button class="mini" id="hide">🙈 Скрыть</button><button class="mini" id="flip">↻ Флип</button><button class="mini" id="reset">↺ Сброс</button></div></section><section class="zone"><div class="stage" id="stage"><div class="empty"><h2>Загрузка карточек…</h2></div></div></section><p class="hint" id="hint">Тап — переворот • свайп — листание</p><nav class="bottom" id="bottom"><button class="btn ghost" id="prev">← Назад</button><button class="btn primary" id="learn">✓ Выучил</button><button class="btn ghost" id="next">Вперёд →</button></nav></main><div class="modal" id="modal"><div class="sheet"><div class="sheetHead"><div class="sheetHeadTop"><span class="pill" id="mSec">Раздел</span><button class="close" id="mClose">×</button></div><h2 id="mTitle">Термин</h2></div><div class="sheetBody" id="mBody">Определение</div><div class="sheetActions"><button class="btn ghost" id="mGo">Открыть в учёбе</button><button class="btn primary" id="mLearn">✓ Выучил</button></div></div></div><div class="toast" id="toast"></div><script>const SKEY='igpzs-v4-learned';let CARDS=[],i=0,flipped=false,section='Все',query='',hideLearned=false,animating=false,sx=null,sy=null,moved=false,mode='study',modalIndex=null;const learned=new Set(JSON.parse(localStorage.getItem(SKEY)||'[]'));const $=id=>document.getElementById(id);const norm=s=>String(s).toLowerCase().replaceAll('ё','е');const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));function frontFix(s){const k=norm(String(s).replace(/\s+/g,' ').trim());if(k==='це е'||k==='цее'||k==='це')return'Ценз';return String(s).trim()}function save(){localStorage.setItem(SKEY,JSON.stringify([...learned]))}function toast(t){const n=$('toast');n.textContent=t;n.style.opacity='1';n.style.transform='translateX(-50%) translateY(0)';clearTimeout(toast.t);toast.t=setTimeout(()=>{n.style.opacity='0';n.style.transform='translateX(-50%) translateY(18px)'},850)}function sections(){return ['Все',...new Set(CARDS.map(c=>c.section))]}function list(){const q=norm(query.trim());return CARDS.map((c,n)=>({...c,n})).filter(c=>(section==='Все'||c.section===section)&&(!hideLearned||!learned.has(c.n))&&(!q||norm(c.front).includes(q)||norm(c.back).includes(q)))}function titleClass(s){if(s.length>42)return'front xlong';if(s.length>26)return'front long';return'front'}function renderChips(){$('chips').innerHTML=sections().map(s=>`<button class="chip ${s===section?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{section=b.dataset.s;i=0;flipped=false;renderChips();render()})}function stats(a){const p=Math.round(learned.size/CARDS.length*100)||0;$('prog').textContent=`Выучено ${learned.size} из ${CARDS.length}`;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('hide').textContent=hideLearned?'👁️ Показать':'🙈 Скрыть';const c=a[i];$('learn').textContent=c&&learned.has(c.n)?'✓ Выучено':'✓ Выучил';$('learn').classList.toggle('learned',!!(c&&learned.has(c.n)));$('tabStudy').classList.toggle('on',mode==='study');$('tabAll').classList.toggle('on',mode==='all');$('bottom').style.display=mode==='study'?'grid':'none';$('actions').style.display='grid';$('flip').style.display=mode==='study'?'block':'none';$('hint').textContent=mode==='study'?'Тап — переворот • свайп — листание':'Нажми на маленькую карточку, чтобы открыть определение'}function render(){const a=list();if(i>=a.length)i=0;if(i<0)i=Math.max(0,a.length-1);stats(a);if(mode==='all')return renderGrid(a);const c=a[i];if(!c){$('stage').innerHTML='<div class="empty"><h2>Ничего не найдено</h2><p>Очисти поиск или фильтр.</p></div>';return}$('stage').innerHTML=`<div class="cardShell"><article class="card ${flipped?'flipped':''}" id="card"><div class="side"><div class="meta"><span>Термин</span><span class="pill">${esc(c.section)}</span><span>${i+1}/${a.length}</span></div><div class="content"><div class="${titleClass(c.front)}">${esc(c.front)}</div></div></div><div class="side back"><div class="meta"><span>Определение</span><span class="pill">${esc(c.section)}</span><span>${i+1}/${a.length}</span></div><div class="content"><div class="def">${esc(c.back)}</div></div></div></article></div>`;const card=$('card');card.onclick=()=>{if(moved)return;flipped=!flipped;card.classList.toggle('flipped',flipped)};card.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false};card.ontouchmove=e=>{if(sx===null)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>12||Math.abs(dy)>12)moved=true};card.ontouchend=e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;sy=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?go(1):go(-1);setTimeout(()=>moved=false,80)}else setTimeout(()=>moved=false,80)}}function renderGrid(a){if(!a.length){$('stage').innerHTML='<div class="empty"><h2>Ничего не найдено</h2><p>Очисти поиск или фильтр.</p></div>';return}$('stage').innerHTML=`<div class="gridWrap"><div class="gridInfo"><b>Показано: ${a.length}</b><span>Всего: ${CARDS.length}</span></div><div class="grid">${a.map(c=>`<button class="smallCard ${learned.has(c.n)?'done':''}" data-open="${c.n}"><b>${esc(c.front)}</b><span>${esc(c.section)}</span></button>`).join('')}</div></div>`;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(Number(b.dataset.open)))}function animate(dir){if(animating)return;const st=$('stage');animating=true;st.classList.remove('enter-left','enter-right','leave-left','leave-right');st.classList.add(dir>0?'leave-left':'leave-right');setTimeout(()=>{render();st.classList.remove('leave-left','leave-right');st.classList.add(dir>0?'enter-right':'enter-left');setTimeout(()=>{st.classList.remove('enter-left','enter-right');animating=false},230)},165)}function go(dir){const a=list();if(!a.length||animating)return;i=(i+dir+a.length)%a.length;flipped=false;animate(dir)}function random(){const a=list();if(!a.length)return;i=Math.floor(Math.random()*a.length);flipped=false;if(mode!=='study'){mode='study'}animate(1);toast('Случайная карточка')}function toggleByIndex(n){if(learned.has(n)){learned.delete(n);toast('Убрано')}else{learned.add(n);toast('Выучено')}save();render()}function toggle(){const a=list(),c=a[i];if(!c)return;toggleByIndex(c.n)}function openModal(n){modalIndex=n;const c=CARDS[n];$('mSec').textContent=c.section;$('mTitle').textContent=c.front;$('mBody').textContent=c.back;$('mLearn').textContent=learned.has(n)?'✓ Уже выучено':'✓ Выучил';$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');modalIndex=null}$('tabStudy').onclick=()=>{mode='study';flipped=false;render()};$('tabAll').onclick=()=>{mode='all';flipped=false;render()};$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);$('learn').onclick=toggle;$('rnd').onclick=random;$('hide').onclick=()=>{hideLearned=!hideLearned;i=0;flipped=false;render()};$('flip').onclick=()=>{flipped=!flipped;render()};$('reset').onclick=()=>{learned.clear();save();i=0;flipped=false;render();toast('Сброшено')};$('q').oninput=e=>{query=e.target.value;i=0;flipped=false;render()};$('mClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('mLearn').onclick=()=>{if(modalIndex!==null){toggleByIndex(modalIndex);openModal(modalIndex)}};$('mGo').onclick=()=>{if(modalIndex===null)return;const a=list();const pos=a.findIndex(c=>c.n===modalIndex);if(pos>=0)i=pos;mode='study';flipped=false;closeModal();render()};document.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape')closeModal();if(mode==='study'){if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '){e.preventDefault();flipped=!flipped;render()}}};async function init(){const html=await fetch('index.html?data='+Date.now()).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const data=doc.getElementById('cards-data');if(!data)throw new Error('Не нашёл cards-data в index.html');CARDS=JSON.parse(data.textContent).map(c=>({front:frontFix(c.front),back:c.back,section:c.section||'Все'}));const dups=CARDS.length-new Set(CARDS.map(c=>c.front)).size;$('badge').textContent=`${CARDS.length} • ${dups} дублей`;console.assert(CARDS.length===141,'Должно быть 141 карточка');console.assert(dups===0,'Дубли: '+dups);renderChips();render()}init().catch(e=>{$('stage').innerHTML='<div class="empty"><h2>Ошибка загрузки</h2><p>'+esc(e.message)+'</p></div>';console.error(e)});</script></body></html>
