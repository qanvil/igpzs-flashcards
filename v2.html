<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>ИГПЗС Flashcards v2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 12% 0%,#38bdf855,transparent 24rem),radial-gradient(circle at 95% 15%,#22c55e33,transparent 20rem),linear-gradient(145deg,#020617,#0f172a 55%,#172554);color:#f8fafc;overscroll-behavior-y:none}button,input{font:inherit}button{border:0;cursor:pointer}.app{min-height:100dvh;max-width:850px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto 1fr auto;gap:10px}.top,.tools{background:#ffffff1a;border:1px solid #ffffff24;border-radius:28px;backdrop-filter:blur(18px);box-shadow:0 10px 30px #02061738}.top{padding:14px}.title{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}h1{font-size:clamp(24px,7vw,42px);line-height:.98;margin:0;letter-spacing:-.04em}.sub{font-size:13px;color:#cbd5e1;margin:7px 0 0;line-height:1.35}.badge{white-space:nowrap;border-radius:999px;background:#38bdf82e;color:#e0f2fe;border:1px solid #7dd3fc59;padding:8px 10px;font-size:12px;font-weight:850}.stats{margin-top:13px;display:grid;grid-template-columns:1fr auto;gap:8px 12px}.stats small{color:#cbd5e1}.progress{grid-column:1/-1;height:10px;border-radius:999px;background:#ffffff24;overflow:hidden}.bar{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#38bdf8,#22c55e);transition:.28s}.tools{padding:11px;display:grid;gap:9px}.search{display:flex;align-items:center;gap:8px;background:#fffffff7;color:#0f172a;border-radius:19px;padding:11px 13px}.search input{width:100%;border:0;outline:0;background:transparent}.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip,.mini{flex:0 0 auto;border-radius:999px;padding:8px 12px;background:#ffffff16;color:#e2e8f0;border:1px solid #ffffff24;font-size:13px;font-weight:800;min-height:38px}.chip.on{background:#38bdf8;color:#082f49}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{border-radius:16px;padding:8px 6px}.zone{display:flex;align-items:center;justify-content:center;min-height:0}.stage{width:100%;perspective:1400px;transform:translateZ(0)}.stage.leave-left{animation:leaveLeft .16s ease-in forwards}.stage.leave-right{animation:leaveRight .16s ease-in forwards}.stage.enter-left{animation:enterLeft .2s ease-out forwards}.stage.enter-right{animation:enterRight .2s ease-out forwards}@keyframes leaveLeft{to{opacity:0;transform:translateX(-36px) scale(.985)}}@keyframes leaveRight{to{opacity:0;transform:translateX(36px) scale(.985)}}@keyframes enterLeft{from{opacity:0;transform:translateX(-40px) scale(.985)}to{opacity:1;transform:translateX(0) scale(1)}}@keyframes enterRight{from{opacity:0;transform:translateX(40px) scale(.985)}to{opacity:1;transform:translateX(0) scale(1)}}.card{width:100%;height:min(55dvh,560px);min-height:400px;position:relative;transform-style:preserve-3d;transition:transform .34s cubic-bezier(.2,.75,.2,1);touch-action:pan-y}.card.flipped{transform:rotateY(180deg)}.side{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:white;color:#0f172a;border-radius:32px;box-shadow:0 24px 70px #0206176b;border:1px solid #0f172a14;backface-visibility:hidden;-webkit-backface-visibility:hidden}.back{transform:rotateY(180deg)}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 15px 0;color:#64748b;font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.11em}.pill{max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0;border-radius:999px;background:#e0f2fe;color:#075985;padding:6px 9px;font-size:11px}.content{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;align-items:center;justify-content:center;padding:14px 18px 23px}.front{max-width:100%;text-align:center;font-size:clamp(30px,10.5vw,66px);line-height:1.06;letter-spacing:-.018em;font-weight:950;overflow-wrap:normal;word-break:normal;hyphens:none;text-wrap:balance}.front.long{font-size:clamp(24px,7.5vw,46px);letter-spacing:-.01em}.front.xlong{font-size:clamp(21px,6.4vw,38px);letter-spacing:0}.def{width:100%;max-width:760px;font-size:clamp(18px,4.75vw,26px);line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.hint{margin:6px 0 0;text-align:center;color:#cbd5e1;font-size:13px}.bottom{position:sticky;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;z-index:10}.btn{min-height:50px;border-radius:18px;background:#ffffffe8;color:#0f172a;font-weight:900;box-shadow:0 10px 26px #02061740}.btn.primary{background:linear-gradient(135deg,#38bdf8,#22c55e);color:#022c22}.btn.ghost{background:#ffffff21;color:#f8fafc;border:1px solid #ffffff29}.btn.learned{background:#22c55e;color:#052e16}.empty{width:100%;padding:30px 20px;background:white;color:#0f172a;border-radius:30px;text-align:center;box-shadow:0 24px 70px #0206176b}.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;background:#0f172af0;border:1px solid #ffffff29;color:white;padding:10px 14px;border-radius:999px;font-weight:840;transition:.2s;z-index:20;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:430px){.app{gap:8px;padding-left:10px;padding-right:10px}.top{padding:12px}.sub{font-size:12.5px}.badge{font-size:11px;padding:7px 8px}.actions{grid-template-columns:repeat(2,1fr)}.card{min-height:380px;height:min(52dvh,500px)}.bottom{grid-template-columns:1fr 1fr}.bottom #learn{grid-column:1/-1;order:-1}}@media(min-width:760px){.app{padding-top:26px;padding-bottom:26px;gap:14px}.top,.tools{padding:18px}.content{padding:20px 38px 34px}.bottom,.actions{max-width:600px;width:100%;justify-self:center}.bottom{position:static}}</style></head><body><main class="app"><section class="top"><div class="title"><div><h1>ИГПЗС Flashcards</h1><p class="sub">Версия v2: анимация листания и нормальные названия без дробления букв.</p></div><div class="badge" id="badge">Загрузка…</div></div><div class="stats"><small id="prog">Выучено 0</small><small id="pct">0%</small><div class="progress"><div class="bar" id="bar"></div></div></div></section><section class="tools"><label class="search"><span>🔎</span><input id="q" type="search" autocomplete="off" placeholder="Поиск по термину или определению"></label><div class="chips" id="chips"></div><div class="actions"><button class="mini" id="rnd">🎲 Рандом</button><button class="mini" id="hide">🙈 Скрыть</button><button class="mini" id="flip">↻ Перевернуть</button><button class="mini" id="reset">↺ Сброс</button></div></section><section class="zone"><div class="stage" id="stage"><div class="empty"><h2>Загрузка карточек…</h2></div></div></section><p class="hint">Тап — переворот. Свайп влево/вправо — листание с анимацией.</p><nav class="bottom"><button class="btn ghost" id="prev">← Назад</button><button class="btn primary" id="learn">✓ Выучил</button><button class="btn ghost" id="next">Вперёд →</button></nav></main><div class="toast" id="toast"></div><script>const SKEY='igpzs-v2-learned';let CARDS=[],i=0,flipped=false,section='Все',query='',hideLearned=false,animating=false,sx=null,sy=null,moved=false;const learned=new Set(JSON.parse(localStorage.getItem(SKEY)||'[]'));const $=id=>document.getElementById(id);const norm=s=>String(s).toLowerCase().replaceAll('ё','е');const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));function frontFix(s){const k=norm(String(s).replace(/\s+/g,' ').trim());if(k==='це е'||k==='цее'||k==='це')return'Ценз';return String(s).trim()}function save(){localStorage.setItem(SKEY,JSON.stringify([...learned]))}function toast(t){const n=$('toast');n.textContent=t;n.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('show'),900)}function sections(){return ['Все',...new Set(CARDS.map(c=>c.section))]}function list(){const q=norm(query.trim());return CARDS.map((c,n)=>({...c,n})).filter(c=>(section==='Все'||c.section===section)&&(!hideLearned||!learned.has(c.n))&&(!q||norm(c.front).includes(q)||norm(c.back).includes(q)))}function titleClass(s){if(s.length>42)return'front xlong';if(s.length>26)return'front long';return'front'}function renderChips(){$('chips').innerHTML=sections().map(s=>`<button class="chip ${s===section?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{section=b.dataset.s;i=0;flipped=false;renderChips();render()})}function stats(a){const p=Math.round(learned.size/CARDS.length*100)||0;$('prog').textContent=`Выучено ${learned.size} из ${CARDS.length}`;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('hide').textContent=hideLearned?'👁️ Показать':'🙈 Скрыть';const c=a[i];$('learn').textContent=c&&learned.has(c.n)?'✓ Выучено':'✓ Выучил';$('learn').classList.toggle('learned',!!(c&&learned.has(c.n)))}function render(){const a=list();if(i>=a.length)i=0;if(i<0)i=Math.max(0,a.length-1);stats(a);const c=a[i];if(!c){$('stage').innerHTML='<div class="empty"><h2>Ничего не найдено</h2><p>Очисти поиск или фильтр.</p></div>';return}$('stage').innerHTML=`<article class="card ${flipped?'flipped':''}" id="card"><div class="side"><div class="meta"><span>Термин</span><span class="pill">${esc(c.section)}</span><span>${i+1}/${a.length}</span></div><div class="content"><div class="${titleClass(c.front)}">${esc(c.front)}</div></div></div><div class="side back"><div class="meta"><span>Определение</span><span class="pill">${esc(c.section)}</span><span>${i+1}/${a.length}</span></div><div class="content"><div class="def">${esc(c.back)}</div></div></div></article>`;const card=$('card');card.onclick=()=>{if(moved)return;flipped=!flipped;card.classList.toggle('flipped',flipped)};card.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false};card.ontouchmove=e=>{if(sx===null)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>12||Math.abs(dy)>12)moved=true};card.ontouchend=e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;sy=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?go(1):go(-1);setTimeout(()=>moved=false,80)}else setTimeout(()=>moved=false,80)}}function animate(dir){if(animating)return;const st=$('stage');animating=true;st.classList.remove('enter-left','enter-right','leave-left','leave-right');st.classList.add(dir>0?'leave-left':'leave-right');setTimeout(()=>{render();st.classList.remove('leave-left','leave-right');st.classList.add(dir>0?'enter-right':'enter-left');setTimeout(()=>{st.classList.remove('enter-left','enter-right');animating=false},220)},155)}function go(dir){const a=list();if(!a.length||animating)return;i=(i+dir+a.length)%a.length;flipped=false;animate(dir)}function random(){const a=list();if(!a.length)return;i=Math.floor(Math.random()*a.length);flipped=false;animate(1);toast('Случайная карточка')}function toggle(){const a=list(),c=a[i];if(!c)return;if(learned.has(c.n)){learned.delete(c.n);toast('Убрано')}else{learned.add(c.n);toast('Выучено')}save();render()}$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);$('learn').onclick=toggle;$('rnd').onclick=random;$('hide').onclick=()=>{hideLearned=!hideLearned;i=0;flipped=false;render()};$('flip').onclick=()=>{flipped=!flipped;render()};$('reset').onclick=()=>{learned.clear();save();i=0;flipped=false;render();toast('Сброшено')};$('q').oninput=e=>{query=e.target.value;i=0;flipped=false;render()};document.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key===' '){e.preventDefault();flipped=!flipped;render()}};async function init(){const html=await fetch('index.html?data='+Date.now()).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const data=doc.getElementById('cards-data');if(!data)throw new Error('Не нашёл cards-data в index.html');CARDS=JSON.parse(data.textContent).map(c=>({front:frontFix(c.front),back:c.back,section:c.section||'Все'}));const dups=CARDS.length-new Set(CARDS.map(c=>c.front)).size;$('badge').textContent=`${CARDS.length} • ${dups} дублей`;console.assert(CARDS.length===141,'Должно быть 141 карточка');console.assert(dups===0,'Дубли: '+dups);renderChips();render()}init().catch(e=>{$('stage').innerHTML='<div class="empty"><h2>Ошибка загрузки</h2><p>'+esc(e.message)+'</p></div>';console.error(e)});</script></body></html>
