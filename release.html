<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>ИГПЗС</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow-x:hidden;overflow-y:auto}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 20% 0,#38bdf855,transparent 22rem),radial-gradient(circle at 100% 20%,#a78bfa44,transparent 20rem),linear-gradient(145deg,#020617,#0f172a 55%,#111827);color:#f8fafc}a{color:inherit;text-decoration:none}.app{max-width:720px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(28px,env(safe-area-inset-bottom));display:grid;gap:14px}.hero,.card{background:linear-gradient(145deg,#ffffff24,#ffffff10);border:1px solid #ffffff29;border-radius:30px;box-shadow:0 20px 60px #02061755;backdrop-filter:blur(18px)}.hero{padding:24px 18px}.badge{display:inline-flex;border-radius:999px;background:#ecfeff;color:#155e75;padding:8px 10px;font-size:12px;font-weight:950}.title{margin:12px 0 0;font-size:clamp(40px,12vw,68px);letter-spacing:-.07em;line-height:.9}.sub{margin:10px 0 0;color:#cbd5e1;line-height:1.4;font-size:15px}.card{padding:18px}.card h2{margin:0;font-size:25px;letter-spacing:-.04em}.card p{margin:8px 0 16px;color:#cbd5e1;line-height:1.4}.btn{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:22px;font-weight:950;background:linear-gradient(135deg,#7dd3fc,#a78bfa,#34d399);color:#03131d;box-shadow:0 14px 32px #0206174a}.mini{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:18px;background:#ffffff18;color:#f8fafc;border:1px solid #ffffff29;font-weight:900}.links{display:grid;gap:10px}</style></head><body><main class="app"><section class="hero"><span class="badge">141 карточка</span><h1 class="title">ИГПЗС</h1><p class="sub">Карточки для повторения терминов.</p></section><section class="card"><h2>Учить</h2><p>Свайп, переворот, поиск, номера, выученные и невыученные.</p><a class="btn" href="v8.html?v=1">Открыть</a></section><section class="links"><a class="mini" href="v8.html?v=1">Все карточки внутри</a></section></main><script>if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(list=>list.forEach(sw=>sw.unregister()));if(window.caches){caches.keys().then(keys=>keys.forEach(k=>caches.delete(k)))}}</script></body></html>
