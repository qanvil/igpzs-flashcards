<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>ИГПЗС</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;overflow-x:hidden;overflow-y:auto}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 20% 0,#38bdf855,transparent 22rem),radial-gradient(circle at 100% 20%,#a78bfa44,transparent 20rem),linear-gradient(145deg,#020617,#0f172a 55%,#111827);color:#f8fafc}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:940px;margin:0 auto;padding:14px 12px 28px;display:flex;flex-direction:column;gap:12px}.panel{background:linear-gradient(145deg,#ffffff24,#ffffff10);border:1px solid #ffffff29;border-radius:28px;box-shadow:0 20px 60px #02061755;backdrop-filter:blur(18px)}.top{padding:15px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h1{margin:0;font-size:clamp(30px,8vw,48px);line-height:.95;letter-spacing:-.055em}.badge{white-space:nowrap;background:#ecfeff;color:#155e75;border-radius:999px;padding:8px 10px;font-size:12px;font-weight:950}.stats{margin-top:13px;display:grid;grid-template-columns:1fr auto;gap:8px 12px;color:#dbeafe;font-size:13px}.barbox{grid-column:1/-1;height:12px;border-radius:99px;background:#ffffff24;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7dd3fc,#a78bfa,#34d399);border-radius:inherit;transition:.25s}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.tab{min-height:48px;border-radius:21px;background:#ffffff14;color:#e2e8f0;border:1px solid #ffffff24;font-weight:950}.tab.on,.filter.on{background:linear-gradient(135deg,#7dd3fc,#a78bfa,#34d399);color:#03131d;border:0}.tools{padding:12px;display:flex;flex-direction:column;gap:10px}.search{display:flex;align-items:center;gap:8px;background:#fff;color:#0f172a;border-radius:21px;padding:11px 13px}.search input{width:100%;border:0;outline:0;background:transparent}.two{display:grid;grid-template-columns:1fr 118px;gap:8px}.chips,.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar,.filters::-webkit-scrollbar{display:none}.chip,.mini,.filter{flex:0 0 auto;border-radius:99px;padding:9px 13px;background:#ffffff14;color:#e2e8f0;border:1px solid #ffffff24;font-size:13px;font-weight:850}.chip.on{background:#7dd3fc;color:#082f49;border:0}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.mini{border-radius:17px;padding:9px 5px}.study{display:block}.cardShell{border-radius:34px;padding:2px;background:linear-gradient(135deg,#7dd3fc,#a78bfa,#34d399);box-shadow:0 24px 72px #0206177a;perspective:1200px}.card{min-height:430px;position:relative;border-radius:32px;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.2,.75,.2,1);touch-action:pan-y}.card.flipped{transform:rotateY(180deg)}.card.inR{animation:inR .22s}.card.inL{animation:inL .22s}@keyframes inR{from{opacity:.25;transform:translateX(55px) scale(.99)}to{opacity:1;transform:translateX(0) scale(1)}}@keyframes inL{from{opacity:.25;transform:translateX(-55px) scale(.99)}to{opacity:1;transform:translateX(0) scale(1)}}.side{position:absolute;inset:0;border-radius:32px;background:linear-gradient(160deg,#fff,#eef6ff 70%,#f7f0ff);color:#0f172a;box-shadow:inset 0 0 0 1px #0f172a14;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column}.back{transform:rotateY(180deg)}.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:15px 16px 0;color:#64748b;font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.12em}.pill{max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:none;letter-spacing:0;background:#0f172a;color:#fff;border-radius:99px;padding:7px 10px;font-size:11px}.content{min-height:365px;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}.front{text-align:center;font-size:clamp(31px,10vw,66px);line-height:1.06;letter-spacing:-.015em;font-weight:1000;word-break:normal;overflow-wrap:normal;text-wrap:balance}.front.long{font-size:clamp(25px,7.5vw,46px)}.front.xlong{font-size:clamp(21px,6.2vw,38px);letter-spacing:0}.def{font-size:clamp(18px,4.6vw,25px);line-height:1.48;white-space:pre-wrap;overflow-wrap:anywhere;color:#111827;text-align:left;width:100%}.studyNav{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin-top:10px}.btn{min-height:52px;border-radius:20px;background:#fffffff2;color:#0f172a;font-weight:950;box-shadow:0 14px 32px #0206174a}.btn.primary{background:linear-gradient(135deg,#7dd3fc,#a78bfa,#34d399);color:#03131d}.btn.ghost{background:#ffffff22;color:#f8fafc;border:1px solid #ffffff2e}.btn.dark{background:#0f172a;color:#fff}.btn.light{background:#e0f2fe;color:#075985}.btn.learned{background:#34d399;color:#052e16}.gridWrap{display:none;padding-bottom:30px}.gridInfo{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;color:#dbeafe;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.smallCard{position:relative;min-height:104px;border-radius:24px;padding:13px 12px;text-align:left;background:linear-gradient(160deg,#fff,#eef6ff 70%,#f7f0ff);color:#0f172a;box-shadow:0 12px 34px #02061740;border:1px solid #ffffff99;overflow:hidden}.num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:24px;border-radius:999px;background:#0f172a;color:#fff;font-size:11px;font-weight:950;margin-bottom:8px;padding:0 8px}.smallCard b{display:block;font-size:16px;line-height:1.14;letter-spacing:-.02em;word-break:normal;overflow-wrap:normal}.smallCard span{display:inline-block;margin-top:9px;border-radius:99px;background:#e0f2fe;color:#075985;padding:5px 7px;font-size:10px;font-weight:850;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.smallCard.done{opacity:.55}.smallCard.done:after{content:"✓";position:absolute;right:10px;top:8px;width:24px;height:24px;border-radius:99px;background:#34d399;color:#052e16;display:grid;place-items:center;font-weight:950}.modal{position:fixed;inset:0;display:none;z-index:50;background:#020617b8;padding:14px;overflow-y:auto;-webkit-overflow-scrolling:touch}.modal.show{display:block}.sheet{width:100%;max-width:760px;margin:40px auto 20px;background:linear-gradient(160deg,#fff,#eef6ff 70%,#f7f0ff);color:#0f172a;border-radius:30px;box-shadow:0 30px 100px #0009;overflow:hidden}.sheetHead{padding:16px;border-bottom:1px solid #0f172a12}.sheetTop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.sheet h2{margin:10px 0 0;font-size:clamp(26px,8vw,44px);line-height:1.05;letter-spacing:-.04em}.close{width:44px;height:44px;border-radius:50%;background:#0f172a;color:#fff;font-size:25px;font-weight:900;flex:0 0 auto}.sheetBody{padding:16px;font-size:19px;line-height:1.5;color:#111827}.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 16px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(18px);opacity:0;background:#020617f2;color:white;border:1px solid #ffffff29;border-radius:99px;padding:10px 15px;font-weight:900;transition:.2s;z-index:60;white-space:nowrap;pointer-events:none}.empty{padding:32px 20px;background:white;color:#0f172a;border-radius:30px;text-align:center}@media(max-width:430px){.app{padding-left:10px;padding-right:10px}.actions{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr 92px}.studyNav{grid-template-columns:1fr 1fr}.studyNav #learn{grid-column:1/-1;order:-1}.card{min-height:390px}.content{min-height:325px}.smallCard{min-height:96px;padding:12px 11px}.smallCard b{font-size:15px}.sheet{margin-top:22px}.sheetBody{font-size:18px}}@media(min-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.content{padding:24px 38px}.studyNav,.actions{max-width:640px;width:100%;align-self:center}.tools{align-items:stretch}}</style></head><body><main class="app"><section class="top panel"><div class="head"><h1>ИГПЗС</h1><div class="badge" id="badge">141</div></div><div class="stats"><small id="prog">0/141</small><small id="pct">0%</small><div class="barbox"><div class="bar" id="bar"></div></div></div></section><section class="tabs panel"><button class="tab on" id="tabStudy">Учить</button><button class="tab" id="tabAll">Все карточки</button></section><section class="tools panel"><div class="two"><label class="search"><span>🔎</span><input id="q" type="search" autocomplete="off" placeholder="Поиск"></label><label class="search"><span>№</span><input id="numFind" type="number" min="1" placeholder="1-141"></label></div><div class="filters"><button class="filter on" data-filter="all">Все</button><button class="filter" data-filter="unlearned">Не выуч.</button><button class="filter" data-filter="learned">Выуч.</button></div><div class="chips" id="chips"></div><div class="actions"><button class="mini" id="rnd">🎲 Рандом</button><button class="mini" id="hide">🙈 Скрыть</button><button class="mini" id="flip">↻ Флип</button><button class="mini" id="reset">↺ Сброс</button></div></section><section class="study" id="study"><div class="cardShell"><article class="card" id="card"><div class="empty"><h2>Загрузка…</h2></div></article></div><nav class="studyNav"><button class="btn ghost" id="prev">←</button><button class="btn primary" id="learn">✓ Выучил</button><button class="btn ghost" id="next">→</button></nav></section><section class="gridWrap" id="all"><div class="gridInfo"><b id="shown">0</b><span id="total">0</span></div><div class="grid" id="grid"></div></section></main><div class="modal" id="modal"><div class="sheet"><div class="sheetHead"><div class="sheetTop"><span class="pill" id="mSec">Раздел</span><button class="close" id="mClose">×</button></div><h2 id="mTitle">Термин</h2></div><div class="sheetBody" id="mBody">Определение</div><div class="sheetActions"><button class="btn dark" id="mGo">Открыть</button><button class="btn light" id="mLearn">✓ Выучил</button></div></div></div><div class="toast" id="toast"></div><script>const SKEY='igpzs-v8-learned';let CARDS=[],i=0,flipped=false,section='Все',query='',statusFilter='all',hideLearned=false,mode='study',modalIndex=null,slide='',sx=null,sy=null,moved=false;const learned=new Set(JSON.parse(localStorage.getItem(SKEY)||'[]'));const $=id=>document.getElementById(id);const norm=s=>String(s).toLowerCase().replaceAll('ё','е');const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));function frontFix(s){const k=norm(String(s).replace(/\s+/g,' ').trim());if(k==='це е'||k==='цее'||k==='це')return'Ценз';return String(s).trim()}function save(){localStorage.setItem(SKEY,JSON.stringify([...learned]))}function toast(t){const n=$('toast');n.textContent=t;n.style.opacity='1';n.style.transform='translateX(-50%) translateY(0)';clearTimeout(toast.t);toast.t=setTimeout(()=>{n.style.opacity='0';n.style.transform='translateX(-50%) translateY(18px)'},850)}function sections(){return ['Все',...new Set(CARDS.map(c=>c.section))]}function matchStatus(n){if(statusFilter==='learned')return learned.has(n);if(statusFilter==='unlearned')return !learned.has(n);return true}function list(){const q=norm(query.trim());return CARDS.map((c,n)=>({...c,n})).filter(c=>(section==='Все'||c.section===section)&&matchStatus(c.n)&&(!hideLearned||!learned.has(c.n))&&(!q||norm(c.front).includes(q)||norm(c.back).includes(q)))}function titleClass(s){if(s.length>42)return'front xlong';if(s.length>26)return'front long';return'front'}function renderChips(){$('chips').innerHTML=sections().map(s=>`<button class="chip ${s===section?'on':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{section=b.dataset.s;i=0;flipped=false;renderChips();render()})}function stats(a){const p=Math.round(learned.size/CARDS.length*100)||0;$('prog').textContent=`${learned.size}/${CARDS.length}`;$('pct').textContent=p+'%';$('bar').style.width=p+'%';$('hide').textContent=hideLearned?'👁️ Показать':'🙈 Скрыть';const c=a[i];$('learn').textContent=c&&learned.has(c.n)?'✓ Выучено':'✓ Выучил';$('learn').classList.toggle('learned',!!(c&&learned.has(c.n)));$('tabStudy').classList.toggle('on',mode==='study');$('tabAll').classList.toggle('on',mode==='all');$('study').style.display=mode==='study'?'block':'none';$('all').style.display=mode==='all'?'block':'none';$('flip').style.display=mode==='study'?'block':'none'}function cardHtml(c,a){return`<div class="side"><div class="meta"><span>Термин</span><span class="pill">${esc(c.section)}</span><span>№${c.n+1} • ${i+1}/${a.length}</span></div><div class="content"><div class="${titleClass(c.front)}">${esc(c.front)}</div></div></div><div class="side back"><div class="meta"><span>Определение</span><span class="pill">${esc(c.section)}</span><span>№${c.n+1}</span></div><div class="content"><div class="def">${esc(c.back)}</div></div></div>`}function render(){const a=list();if(i>=a.length)i=0;if(i<0)i=Math.max(0,a.length-1);stats(a);if(mode==='all')return renderGrid(a);const c=a[i];if(!c){$('card').className='card';$('card').innerHTML='<div class="empty"><h2>Ничего не найдено</h2></div>';return}$('card').className='card '+(flipped?'flipped ':'')+slide;$('card').innerHTML=cardHtml(c,a);attachCard();if(slide)setTimeout(()=>{slide='';$('card').className='card '+(flipped?'flipped':'')},260)}function attachCard(){const card=$('card');card.onclick=()=>{if(moved){moved=false;return}flipped=!flipped;slide='';render()};card.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false};card.ontouchmove=e=>{if(sx===null)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>18&&Math.abs(dx)>Math.abs(dy)*1.25)moved=true};card.ontouchend=e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;sy=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.35){moved=true;dx<0?go(1):go(-1);setTimeout(()=>moved=false,120)}else setTimeout(()=>moved=false,80)}}function renderGrid(a){$('shown').textContent=`Показано: ${a.length}`;$('total').textContent=`Всего: ${CARDS.length}`;$('grid').innerHTML=a.length?a.map(c=>`<button class="smallCard ${learned.has(c.n)?'done':''}" data-open="${c.n}"><em class="num">№${c.n+1}</em><b>${esc(c.front)}</b><span>${esc(c.section)}</span></button>`).join(''):'<div class="empty"><h2>Ничего не найдено</h2></div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openModal(Number(b.dataset.open)))}function go(dir){const a=list();if(!a.length)return;i=(i+dir+a.length)%a.length;flipped=false;slide=dir>0?'inR':'inL';render()}function random(){const a=list();if(!a.length)return;i=Math.floor(Math.random()*a.length);mode='study';flipped=false;slide='inR';render();toast('Случайная')}function toggleByIndex(n){if(learned.has(n)){learned.delete(n);toast('Убрано')}else{learned.add(n);toast('Выучено')}save();render()}function toggle(){const a=list(),c=a[i];if(c)toggleByIndex(c.n)}function openModal(n){modalIndex=n;const c=CARDS[n];$('mSec').textContent='№'+(n+1)+' • '+c.section;$('mTitle').textContent=c.front;$('mBody').textContent=c.back;$('mLearn').textContent=learned.has(n)?'✓ Уже выучено':'✓ Выучил';$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');modalIndex=null}function jumpNumber(){const n=Number($('numFind').value);if(!n||n<1||n>CARDS.length){toast('Номер 1–'+CARDS.length);return}const a=list();const pos=a.findIndex(c=>c.n===n-1);if(pos<0){toast('Не в текущем фильтре');return}i=pos;mode='study';flipped=false;slide='inR';render();window.scrollTo({top:0,behavior:'smooth'})}$('tabStudy').onclick=()=>{mode='study';flipped=false;render();window.scrollTo({top:0,behavior:'smooth'})};$('tabAll').onclick=()=>{mode='all';flipped=false;render()};$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);$('learn').onclick=toggle;$('rnd').onclick=random;$('hide').onclick=()=>{hideLearned=!hideLearned;i=0;flipped=false;render()};$('flip').onclick=()=>{flipped=!flipped;slide='';render()};$('reset').onclick=()=>{if(confirm('Сбросить весь прогресс?')){learned.clear();save();i=0;flipped=false;render();toast('Сброшено')}};$('q').oninput=e=>{query=e.target.value;i=0;flipped=false;render()};$('numFind').onkeydown=e=>{if(e.key==='Enter')jumpNumber()};$('numFind').onchange=jumpNumber;$('mClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('mLearn').onclick=()=>{if(modalIndex!==null){toggleByIndex(modalIndex);openModal(modalIndex)}};$('mGo').onclick=()=>{if(modalIndex===null)return;const a=list();const pos=a.findIndex(c=>c.n===modalIndex);if(pos>=0)i=pos;mode='study';flipped=false;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));i=0;flipped=false;render()});async function init(){const html=await fetch('index.html?data='+Date.now()).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const data=doc.getElementById('cards-data');if(!data)throw new Error('Не нашёл cards-data');CARDS=JSON.parse(data.textContent).map(c=>({front:frontFix(c.front),back:c.back,section:c.section||'Все'}));const dups=CARDS.length-new Set(CARDS.map(c=>c.front)).size;$('badge').textContent=`${CARDS.length} • ${dups} дублей`;console.assert(CARDS.length===141,'Должно быть 141 карточка');console.assert(dups===0,'Дубли: '+dups);renderChips();render()}init().catch(e=>{$('card').innerHTML='<div class="empty"><h2>Ошибка</h2><p>'+esc(e.message)+'</p></div>';console.error(e)});</script></body></html>
