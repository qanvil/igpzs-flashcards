<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>ИГПЗС Кроссворды</title><style>:root{--a:#7dd3fc;--b:#a78bfa;--c:#34d399;--bg:#07111f;--ink:#08111f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#f8fafc;background:radial-gradient(circle at 20% -10%,#7dd3fc55,transparent 22rem),radial-gradient(circle at 100% 10%,#a78bfa44,transparent 20rem),radial-gradient(circle at 40% 105%,#34d3993d,transparent 22rem),linear-gradient(145deg,#020617,#0f172a 48%,#111827)}button,input{font:inherit}button{border:0;cursor:pointer}.app{max-width:1100px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 12px max(18px,env(safe-area-inset-bottom));display:grid;gap:12px}.panel{background:linear-gradient(145deg,#ffffff24,#ffffff10);border:1px solid #ffffff29;border-radius:30px;box-shadow:0 20px 60px #02061755;backdrop-filter:blur(22px)}.top{padding:16px}h1{margin:0;font-size:clamp(28px,8vw,48px);letter-spacing:-.055em;line-height:.95}.sub{margin:8px 0 0;color:#cbd5e1;font-size:13px;line-height:1.4}.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.badge{border-radius:999px;background:#ecfeff;color:#155e75;padding:8px 10px;font-size:12px;font-weight:950}.tabs{display:flex;gap:8px;overflow:auto;padding:8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;border-radius:999px;padding:10px 13px;background:#ffffff14;color:#e2e8f0;border:1px solid #ffffff24;font-weight:850}.tab.on{background:linear-gradient(135deg,var(--a),var(--b),var(--c));color:#03131d;border:0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}.btn{min-height:46px;border-radius:18px;font-weight:950;background:#fffffff0;color:#0f172a;box-shadow:0 10px 26px #02061736}.btn.primary{background:linear-gradient(135deg,var(--a),var(--b),var(--c));color:#03131d}.main{display:grid;gap:12px}.boardWrap{padding:10px;overflow:auto}.board{display:grid;gap:2px;width:max-content;margin:auto;background:#ffffff18;padding:8px;border-radius:18px}.cell{width:34px;height:34px;border-radius:7px;position:relative;background:#ffffff;color:#0f172a;display:grid;place-items:center;box-shadow:inset 0 0 0 1px #0f172a18}.cell.block{background:#ffffff14;box-shadow:none}.cell input{width:100%;height:100%;border:0;outline:0;background:transparent;text-align:center;text-transform:uppercase;font-size:18px;font-weight:950;color:#0f172a}.cell input.good{background:#dcfce7}.cell input.bad{background:#ffe4e6}.num{position:absolute;top:2px;left:3px;font-size:8px;font-weight:950;color:#64748b;pointer-events:none}.clues{display:grid;gap:12px}.clueBox{padding:14px}.clueBox h2{margin:0 0 10px;font-size:20px}.clueList{display:grid;gap:8px;max-height:42vh;overflow:auto;padding-right:2px}.clue{background:#ffffff10;border:1px solid #ffffff1f;border-radius:16px;padding:10px;color:#e2e8f0;font-size:14px;line-height:1.35}.clue b{color:#fff}.answer{display:block;margin-top:6px;color:#7dd3fc;font-weight:850;filter:blur(5px);user-select:none}.showAnswers .answer{filter:none}.note{padding:12px 14px;color:#dbeafe;font-size:13px}.empty{padding:28px;text-align:center;background:white;color:#0f172a;border-radius:28px}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(18px);opacity:0;pointer-events:none;background:#020617f2;border:1px solid #ffffff29;color:white;padding:10px 15px;border-radius:999px;font-weight:900;transition:.2s;z-index:50;white-space:nowrap}@media(min-width:850px){.main{grid-template-columns:minmax(0,1.35fr) minmax(320px,.8fr)}.clues{align-self:start}.cell{width:32px;height:32px}.tools{max-width:620px}}@media(max-width:420px){.cell{width:29px;height:29px;border-radius:6px}.cell input{font-size:16px}.boardWrap{padding:7px}.board{padding:6px}.tools{grid-template-columns:1fr}.clueList{max-height:36vh}}</style></head><body><main class="app"><section class="top panel"><h1>ИГПЗС Кроссворды</h1><p class="sub">Несколько кроссвордов по всем терминам. Подсказки — определения из карточек. Ответы можно скрывать/показывать.</p><div class="stats" id="stats"><span class="badge">Загрузка…</span></div></section><nav class="tabs panel" id="tabs"></nav><section class="tools panel"><button class="btn primary" id="check">Проверить ответы</button><button class="btn" id="answers">Показать ответы</button><button class="btn" id="clear">Очистить текущий</button><button class="btn" id="print">Печать / PDF</button></section><section class="main"><div class="boardWrap panel"><div id="board" class="empty">Загрузка кроссвордов…</div></div><aside class="clues"><div class="clueBox panel"><h2 id="clueTitle">Подсказки</h2><div class="clueList" id="clues"></div></div><div class="note panel" id="note">Пробелы и скобки в терминах убраны только внутри сетки, чтобы ответ помещался. Сам термин показывается в подсказке полностью.</div></aside></section></main><div class="toast" id="toast"></div><script>let CARDS=[],PUZZLES=[],active=0,showAnswers=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));const norm=s=>String(s).toUpperCase().replace(/Ё/g,'Е').replace(/[^А-ЯA-Z0-9]/g,'');function frontFix(s){const k=String(s).toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ').trim();if(k==='це е'||k==='цее'||k==='це')return'Ценз';return String(s).trim()}function toast(t){const n=$('toast');n.textContent=t;n.style.opacity='1';n.style.transform='translateX(-50%) translateY(0)';clearTimeout(toast.t);toast.t=setTimeout(()=>{n.style.opacity='0';n.style.transform='translateX(-50%) translateY(18px)'},1200)}function groups(){const by={};CARDS.forEach((c,i)=>{(by[c.section] ||= []).push({...c,i,word:norm(c.front)})});return Object.entries(by).map(([section,cards])=>({section,cards:cards.filter(c=>c.word.length>1)}))}function makeGrid(cards,size=33){const grid=Array.from({length:size},()=>Array(size).fill(null));const placed=[],failed=[];const sorted=[...cards].sort((a,b)=>b.word.length-a.word.length);function canPlace(word,r,c,dir){if(dir==='H'&&(c<0||c+word.length>size))return false;if(dir==='V'&&(r<0||r+word.length>size))return false;let cross=0;for(let k=0;k<word.length;k++){const rr=r+(dir==='V'?k:0),cc=c+(dir==='H'?k:0),cur=grid[rr][cc];if(cur&&cur!==word[k])return false;if(cur===word[k])cross++;if(!cur){if(dir==='H'){if((grid[rr-1]?.[cc])||(grid[rr+1]?.[cc]))return false}else{if((grid[rr]?.[cc-1])||(grid[rr]?.[cc+1]))return false}}}const before=dir==='H'?grid[r]?.[c-1]:grid[r-1]?.[c];const after=dir==='H'?grid[r]?.[c+word.length]:grid[r+word.length]?.[c];if(before||after)return false;return placed.length===0||cross>0}function put(item,r,c,dir){for(let k=0;k<item.word.length;k++){grid[r+(dir==='V'?k:0)][c+(dir==='H'?k:0)]=item.word[k]}placed.push({...item,r,c,dir})}for(const item of sorted){let best=null;for(let r=0;r<size;r++)for(let c=0;c<size;c++)for(const dir of ['H','V']){if(!canPlace(item.word,r,c,dir))continue;let score=0;for(let k=0;k<item.word.length;k++){const rr=r+(dir==='V'?k:0),cc=c+(dir==='H'?k:0);if(grid[rr][cc]===item.word[k])score+=10}score-=Math.abs(r-size/2)+Math.abs(c-size/2);if(!best||score>best.score)best={r,c,dir,score}}if(!best&&placed.length===0)best={r:Math.floor(size/2),c:Math.max(0,Math.floor((size-item.word.length)/2)),dir:'H',score:0};if(best)put(item,best.r,best.c,best.dir);else failed.push(item)}if(failed.length){for(const item of [...failed]){let ok=false;for(let r=0;r<size&&!ok;r++){for(let c=0;c+item.word.length<size&&!ok;c++){let free=true;for(let k=0;k<item.word.length;k++)if(grid[r][c+k]){free=false;break}if(free){put(item,r,c,'H');failed.splice(failed.indexOf(item),1);ok=true}}}}}let minR=size,maxR=0,minC=size,maxC=0;placed.forEach(p=>{minR=Math.min(minR,p.r);minC=Math.min(minC,p.c);maxR=Math.max(maxR,p.r+(p.dir==='V'?p.word.length-1:0));maxC=Math.max(maxC,p.c+(p.dir==='H'?p.word.length-1:0))});const cropped=[];for(let r=minR;r<=maxR;r++)cropped.push(grid[r].slice(minC,maxC+1));placed.forEach((p,idx)=>{p.num=idx+1;p.r-=minR;p.c-=minC});return{grid:cropped,placed,failed}}function build(){PUZZLES=groups().map(g=>({name:g.section,...makeGrid(g.cards,Math.max(33,Math.min(45,18+g.cards.length)))}));const total=PUZZLES.reduce((s,p)=>s+p.placed.length,0);const failed=PUZZLES.reduce((s,p)=>s+p.failed.length,0);$('stats').innerHTML=`<span class="badge">${CARDS.length} термин</span><span class="badge">В кроссвордах: ${total}</span><span class="badge">Не вставилось: ${failed}</span><span class="badge">Кроссвордов: ${PUZZLES.length}</span>`;console.assert(CARDS.length===141,'Должно быть 141 карточка');console.assert(total+failed===CARDS.length,'Покрытие терминов нарушено');console.assert(failed===0,'Есть невставленные слова: '+failed)}function renderTabs(){$('tabs').innerHTML=PUZZLES.map((p,i)=>`<button class="tab ${i===active?'on':''}" data-i="${i}">${esc(p.name)} <small>${p.placed.length}</small></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{active=Number(b.dataset.i);showAnswers=false;render()})}function render(){renderTabs();const p=PUZZLES[active];if(!p){$('board').innerHTML='Нет данных';return}const nums={};p.placed.forEach(w=>nums[`${w.r},${w.c}`]=w.num);$('board').className='board';$('board').style.gridTemplateColumns=`repeat(${p.grid[0].length},34px)`;$('board').innerHTML=p.grid.map((row,r)=>row.map((ch,c)=>ch?`<div class="cell"><span class="num">${nums[`${r},${c}`]||''}</span><input maxlength="1" data-a="${ch}" aria-label="буква"></div>`:`<div class="cell block"></div>`).join('')).join('');$('clueTitle').textContent=`${p.name}: подсказки`;$('clues').classList.toggle('showAnswers',showAnswers);$('clues').innerHTML=p.placed.sort((a,b)=>a.num-b.num).map(w=>`<div class="clue"><b>${w.num}. ${w.dir==='H'?'по горизонтали':'по вертикали'}</b><br>${esc(w.back)}<span class="answer">Ответ: ${esc(w.front)} (${esc(w.word)})</span></div>`).join('')+(p.failed.length?`<div class="clue"><b>Не вставились:</b><br>${p.failed.map(x=>esc(x.front)).join(', ')}</div>`:'');document.querySelectorAll('.cell input').forEach(inp=>{inp.oninput=e=>{e.target.value=e.target.value.toUpperCase().slice(-1);e.target.classList.remove('good','bad');const next=e.target.parentElement.nextElementSibling?.querySelector('input');if(next&&e.target.value)next.focus()}})}function check(){let good=0,bad=0;document.querySelectorAll('.cell input').forEach(i=>{i.classList.remove('good','bad');if(!i.value)return;const ok=norm(i.value)===i.dataset.a;i.classList.add(ok?'good':'bad');ok?good++:bad++});toast(`Верно: ${good}, ошибок: ${bad}`)}function clear(){document.querySelectorAll('.cell input').forEach(i=>{i.value='';i.classList.remove('good','bad')})}async function init(){const html=await fetch('index.html?cross='+Date.now()).then(r=>r.text());const doc=new DOMParser().parseFromString(html,'text/html');const data=doc.getElementById('cards-data');if(!data)throw new Error('Не нашёл cards-data в index.html');CARDS=JSON.parse(data.textContent).map(c=>({front:frontFix(c.front),back:c.back,section:c.section||'Все'}));build();render()}$('check').onclick=check;$('answers').onclick=()=>{showAnswers=!showAnswers;$('answers').textContent=showAnswers?'Скрыть ответы':'Показать ответы';render()};$('clear').onclick=clear;$('print').onclick=()=>window.print();init().catch(e=>{$('board').className='empty';$('board').innerHTML='<h2>Ошибка</h2><p>'+esc(e.message)+'</p>';console.error(e)});</script></body></html>
