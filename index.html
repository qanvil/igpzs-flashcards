<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ИГПЗС" />
  <meta name="description" content="Мобильные флеш-карточки ИГПЗС по глоссарию: 141 термин без сокращений." />
  <title>ИГПЗС Flashcards</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(255,255,255,.10);
      --panel-strong: rgba(255,255,255,.16);
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --white: #f8fafc;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #fb7185;
      --shadow: 0 24px 70px rgba(2, 6, 23, .38);
      --radius: 28px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(56, 189, 248, .35), transparent 28rem),
        radial-gradient(circle at 95% 20%, rgba(34, 197, 94, .22), transparent 22rem),
        linear-gradient(145deg, #020617 0%, #0f172a 50%, #1e293b 100%);
      color: var(--white);
      overscroll-behavior-y: none;
    }

    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }

    .app {
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
      max-width: 860px;
      margin: 0 auto;
    }

    .top {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      padding: 15px;
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 30px rgba(2, 6, 23, .22);
    }

    .title-row { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
    h1 { margin: 0; font-size: clamp(24px, 7vw, 42px); line-height: .98; letter-spacing: -.05em; }
    .subtitle { margin: 7px 0 0; color: #cbd5e1; font-size: 13px; line-height: 1.45; }
    .badge {
      white-space: nowrap;
      border-radius: 999px;
      background: rgba(56, 189, 248, .17);
      color: #e0f2fe;
      border: 1px solid rgba(125, 211, 252, .35);
      padding: 8px 10px;
      font-weight: 800;
      font-size: 12px;
    }

    .stats { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; margin-top: 14px; }
    .stats small { color: #cbd5e1; }
    .progress { height: 11px; background: rgba(255,255,255,.13); border-radius: 999px; overflow: hidden; }
    .bar { width: 0%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .25s ease; }

    .tools {
      display: grid;
      gap: 10px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      padding: 12px;
      backdrop-filter: blur(18px);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.96);
      color: var(--text);
      border-radius: 20px;
      padding: 12px 14px;
    }
    .search input { width: 100%; outline: none; border: 0; background: transparent; color: var(--text); }
    .search input::placeholder { color: #94a3b8; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 10px 13px;
      color: #e2e8f0;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 13px;
      font-weight: 700;
    }
    .chip.active { background: var(--accent); color: #082f49; border-color: rgba(255,255,255,.0); }

    .card-zone { display: flex; min-height: 0; align-items: center; justify-content: center; }
    .flip-wrap { width: 100%; perspective: 1400px; }
    .flashcard {
      width: 100%;
      min-height: min(56dvh, 560px);
      height: min(56dvh, 560px);
      position: relative;
      transform-style: preserve-3d;
      transition: transform .36s cubic-bezier(.2,.75,.2,1);
    }
    .flashcard.flipped { transform: rotateY(180deg); }
    .side {
      position: absolute;
      inset: 0;
      background: var(--card);
      color: var(--text);
      border-radius: 34px;
      box-shadow: var(--shadow);
      backface-visibility: hidden;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(15, 23, 42, .08);
    }
    .back { transform: rotateY(180deg); }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 15px 16px 0;
      color: #64748b;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
    }
    .section-pill {
      max-width: 58%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-transform: none;
      letter-spacing: 0;
      border-radius: 999px;
      background: #e0f2fe;
      color: #075985;
      padding: 7px 10px;
      font-size: 12px;
    }

    .card-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: contain;
    }
    .front-text {
      font-size: clamp(32px, 11vw, 68px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 950;
      text-align: center;
      overflow-wrap: anywhere;
    }
    .back-text {
      width: 100%;
      max-width: 760px;
      font-size: clamp(18px, 5vw, 26px);
      line-height: 1.45;
      letter-spacing: -.015em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .hint { margin: 8px 0 0; text-align: center; color: #cbd5e1; font-size: 13px; }

    .bottom {
      position: sticky;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 9px;
      z-index: 10;
    }
    .btn {
      min-height: 50px;
      border-radius: 18px;
      background: rgba(255,255,255,.92);
      color: #0f172a;
      font-weight: 900;
      box-shadow: 0 10px 26px rgba(2,6,23,.25);
    }
    .btn.primary { background: linear-gradient(135deg, #38bdf8, #22c55e); color: #022c22; }
    .btn.ghost { background: rgba(255,255,255,.13); color: #f8fafc; border: 1px solid rgba(255,255,255,.16); }
    .btn.learned { background: #22c55e; color: #052e16; }

    .extra-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: -3px; }
    .mini {
      min-height: 42px;
      border-radius: 16px;
      background: rgba(255,255,255,.11);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,.14);
      font-weight: 800;
      font-size: 13px;
    }

    .empty {
      width: 100%;
      padding: 30px 20px;
      background: var(--card);
      color: var(--text);
      border-radius: 30px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .empty h2 { margin: 0; font-size: 28px; }
    .empty p { color: var(--muted); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(86px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: rgba(15,23,42,.92);
      border: 1px solid rgba(255,255,255,.16);
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 800;
      transition: .2s ease;
      z-index: 20;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 760px) {
      .app { padding-top: 28px; padding-bottom: 28px; gap: 16px; }
      .tools { grid-template-columns: 1fr; }
      .top, .tools { padding: 20px; }
      .card-content { padding: 20px 38px 34px; }
      .bottom { position: static; max-width: 560px; width: 100%; justify-self: center; }
      .extra-actions { max-width: 560px; width: 100%; justify-self: center; }
    }
  </style>
</head>

  <main class="app">
    <section class="top">
      <div class="title-row">
        <div>
          <h1>ИГПЗС Flashcards</h1>
          <p class="subtitle">Мобильный тренажёр: термин спереди, полное определение сзади. Текст не сокращён.</p>
        </div>
        <div class="badge" id="integrityBadge">141 • 0 дублей</div>
      </div>
      <div class="stats">

        <small id="percentLabel">0%</small>
        <div class="progress" style="grid-column: 1 / -1;"><div class="bar" id="progressBar"></div></div>
      </div>
    </section>

    <section class="tools">
      <div class="search">
        <span>🔎</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Поиск по термину или определению" />
      </div>
      <div class="chips" id="chips"></div>
      <div class="extra-actions">
        <button class="mini" id="randomBtn">🎲 Случайно</button>
        <button class="mini" id="hideBtn">🙈 Скрыть</button>
        <button class="mini" id="resetBtn">↺ Сброс</button>
      </div>
    </section>

    <section class="card-zone" id="cardZone"></section>
    <p class="hint" id="hint">Тап — переворот • свайп влево/вправо — следующая/предыдущая</p>

    <nav class="bottom">
      <button class="btn ghost" id="prevBtn">←</button>
      <button class="btn primary" id="learnBtn">✓ Выучил</button>
      <button class="btn ghost" id="nextBtn">→</button>
    </nav>
  </main>

  <div class="toast" id="toast">Готово</div>

  <script>
    const cards = JSON.parse(document.getElementById('cards-data').textContent);
    const expectedCount = 141;
    const sections = ['Все', ...Array.from(new Set(cards.map(card => card.section)))];
    const stateKey = 'igpzs-flashcards-state-v2';

    let state = loadState();
    let filtered = [];
    let touchStartX = 0;
    let touchStartY = 0;

    const el = {
      cardZone: document.getElementById('cardZone'),
      chips: document.getElementById('chips'),
      search: document.getElementById('searchInput'),
      progressLabel: document.getElementById('progressLabel'),
      percentLabel: document.getElementById('percentLabel'),
      progressBar: document.getElementById('progressBar'),
      integrityBadge: document.getElementById('integrityBadge'),
      prev: document.getElementById('prevBtn'),
      next: document.getElementById('nextBtn'),
      learn: document.getElementById('learnBtn'),
      random: document.getElementById('randomBtn'),
      hide: document.getElementById('hideBtn'),
      reset: document.getElementById('resetBtn'),
      toast: document.getElementById('toast'),
    };

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(stateKey) || '{}');
        return {
          index: Number.isFinite(saved.index) ? saved.index : 0,
          flipped: false,
          query: saved.query || '',
          section: saved.section || 'Все',
          hideLearned: Boolean(saved.hideLearned),
          learned: Array.isArray(saved.learned) ? saved.learned : [],
        };
      } catch {
        return { index: 0, flipped: false, query: '', section: 'Все', hideLearned: false, learned: [] };
      }
    }

    function saveState() {
      localStorage.setItem(stateKey, JSON.stringify({
        index: state.index,
        query: state.query,
        section: state.section,
        hideLearned: state.hideLearned,
        learned: state.learned,
      }));
    }

    function normalize(value) { return value.toLowerCase().replaceAll('ё', 'е').trim(); }
    function learnedSet() { return new Set(state.learned); }

    function showToast(message) {
      el.toast.textContent = message;
      el.toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => el.toast.classList.remove('show'), 900);
    }

    function getFiltered() {
      const q = normalize(state.query);
      const learned = learnedSet();
      return cards.filter(card => {
        const inSection = state.section === 'Все' || card.section === state.section;
        const inQuery = !q || normalize(card.front).includes(q) || normalize(card.back).includes(q);
        const inLearned = !state.hideLearned || !learned.has(card.id);
        return inSection && inQuery && inLearned;
      });
    }

    function checkIntegrity() {
      const unique = new Set(cards.map(card => card.front));
      const ok = cards.length === expectedCount && unique.size === cards.length;
      el.integrityBadge.textContent = ok ? '141 • 0 дублей' : `${cards.length} • дублей: ${cards.length - unique.size}`;
      el.integrityBadge.style.background = ok ? 'rgba(56, 189, 248, .17)' : 'rgba(251, 113, 133, .22)';
    }

    function renderChips() {
      el.chips.innerHTML = '';
      sections.forEach(section => {
        const count = section === 'Все' ? cards.length : cards.filter(card => card.section === section).length;
        const button = document.createElement('button');
        button.className = `chip${state.section === section ? ' active' : ''}`;
        button.textContent = `${section} ${count}`;
        button.addEventListener('click', () => {
          state.section = section;
          state.index = 0;
          state.flipped = false;
          saveState();
          render();
        });
        el.chips.appendChild(button);
      });
    }

    function renderStats() {
      const learnedCount = state.learned.length;
      const percent = Math.round((learnedCount / cards.length) * 100);
      el.progressLabel.textContent = `Выучено ${learnedCount} из ${cards.length}`;
      el.percentLabel.textContent = `${percent}%`;
      el.progressBar.style.width = `${percent}%`;
      el.hide.textContent = state.hideLearned ? '👁️ Все' : '🙈 Скрыть';
    }

    function renderCard() {
      filtered = getFiltered();
      if (state.index >= filtered.length) state.index = Math.max(0, filtered.length - 1);
      if (state.index < 0) state.index = 0;

      if (!filtered.length) {
        el.cardZone.innerHTML = `
          <div class="empty">
            <h2>Ничего не найдено</h2>
            <p>Очисти поиск, выбери другой раздел или покажи выученные карточки.</p>
          </div>`;
        el.learn.disabled = true;
        return;
      }

      const card = filtered[state.index];
      const isLearned = learnedSet().has(card.id);
      el.learn.disabled = false;
      el.learn.classList.toggle('learned', isLearned);
      el.learn.textContent = isLearned ? '✓ Выучено' : '✓ Выучил';

      el.cardZone.innerHTML = `
        <div class="flip-wrap" id="flipWrap">
          <article class="flashcard ${state.flipped ? 'flipped' : ''}" id="flashcard" aria-live="polite">
            <div class="side front">
              <div class="card-meta"><span>Термин</span><span class="section-pill">${escapeHtml(card.section)}</span></div>
              <div class="card-content"><div class="front-text">${escapeHtml(card.front)}</div></div>
            </div>
            <div class="side back">
              <div class="card-meta"><span>Определение</span><span>${state.index + 1} / ${filtered.length}</span></div>
              <div class="card-content"><div class="back-text">${escapeHtml(card.back)}</div></div>
            </div>
          </article>
        </div>`;

      const flashcard = document.getElementById('flashcard');
      flashcard.addEventListener('click', () => { state.flipped = !state.flipped; renderCard(); });
      flashcard.addEventListener('touchstart', onTouchStart, { passive: true });
      flashcard.addEventListener('touchend', onTouchEnd, { passive: true });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function move(delta) {
      if (!filtered.length) return;
      state.index = (state.index + delta + filtered.length) % filtered.length;
      state.flipped = false;
      saveState();
      renderCard();
    }

    function randomCard() {
      filtered = getFiltered();
      if (!filtered.length) return;
      state.index = Math.floor(Math.random() * filtered.length);
      state.flipped = false;
      saveState();
      renderCard();
      showToast('Случайная карточка');
    }

    function toggleLearned() {
      filtered = getFiltered();
      const card = filtered[state.index];
      if (!card) return;
      const set = learnedSet();
      if (set.has(card.id)) {
        set.delete(card.id);
        showToast('Убрано из выученных');
      } else {
        set.add(card.id);
        showToast('Отмечено как выученное');
      }
      state.learned = [...set].sort((a, b) => a - b);
      if (state.hideLearned) state.index = Math.min(state.index, Math.max(0, getFiltered().length - 1));
      saveState();
      render();
    }

    function resetProgress() {
      if (!confirm('Сбросить весь прогресс?')) return;
      state.learned = [];
      state.index = 0;
      state.flipped = false;
      saveState();
      render();
      showToast('Прогресс сброшен');
    }

    function onTouchStart(event) {
      const t = event.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }

    function onTouchEnd(event) {
      const t = event.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) > 56 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        dx < 0 ? move(1) : move(-1);
      }
    }

    function render() {
      checkIntegrity();
      renderChips();
      renderStats();
      renderCard();
      saveState();
    }

    el.prev.addEventListener('click', () => move(-1));
    el.next.addEventListener('click', () => move(1));
    el.learn.addEventListener('click', toggleLearned);
    el.random.addEventListener('click', randomCard);
    el.reset.addEventListener('click', resetProgress);
    el.hide.addEventListener('click', () => {
      state.hideLearned = !state.hideLearned;
      state.index = 0;
      state.flipped = false;
      saveState();
      render();
    });
    el.search.value = state.query;
    el.search.addEventListener('input', () => {
      state.query = el.search.value;
      state.index = 0;
      state.flipped = false;
      render();
    });

    document.addEventListener('keydown', (event) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (event.key === 'ArrowLeft') move(-1);
      if (event.key === 'ArrowRight') move(1);
      if (event.key === ' ') { event.preventDefault(); state.flipped = !state.flipped; renderCard(); }
      if (event.key.toLowerCase() === 'r') randomCard();
      if (event.key.toLowerCase() === 'v') toggleLearned();
    });

    render();
  </script>
